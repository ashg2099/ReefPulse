[project]
name = "reefpulse-backend"
version = "0.1.0"
description = "AI-powered reef health monitoring backend"
authors = [
    {name = "Ashwin Gururaj"}
]
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "pydantic (>=2.11.9,<2.13.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "chromadb (>=1.1.0,<1.2.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "crewai (>=1.14.7,<2.0.0)",
    "crewai-tools (>=1.14.7,<2.0.0)",
    "groq (>=1.5.0,<2.0.0)",
    "litellm (>=1.89.3,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
