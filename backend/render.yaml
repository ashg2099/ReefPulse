services:
  - type: web
    name: reefpulse-api
    runtime: python
    buildCommand: pip install poetry && poetry install --no-root
    startCommand: poetry run uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GROQ_API_KEY
        sync: false   # you'll enter this manually in Render dashboard